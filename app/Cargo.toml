[package]
name = "present"
version = "1.2.3"
edition = "2021"

[dependencies]
ratatui = "0.30"
crossterm = "0.28"
anyhow = "1"
mmdflux = "2.2"
pulldown-cmark = "0.12"
tui-big-text = "0.8.4"
font8x8 = "0.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
typst-as-lib = { version = "0.16", default-features = false, features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
typst-pdf = "0.15"
typst-layout = "0.15"
